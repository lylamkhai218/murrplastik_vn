        <rect width="280" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
        <path d="M 34 16 L 42 20 L 42 28 L 34 32 L 26 28 L 26 20 Z" fill="none" stroke="#0f172a" stroke-width="1.5" />
        <path d="M 34 16 L 34 32 M 26 20 L 34 24 L 42 20" stroke="#0f172a" stroke-width="1" />
        <text x="54" y="28" fill="#0f172a" class="font-heavy" font-size="15" letter-spacing="1">
          KHÁM PHÁ GIAN HÀNG 3D NGAY
        </text>
      </g>
    </g>

  </g>
</svg>
