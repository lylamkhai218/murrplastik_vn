<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
  <defs>
    <!-- Embedded Google Fonts for Barlow & Barlow Condensed -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap');

      .font-heavy {
        font-family: 'Barlow Condensed', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
      .font-title {
        font-family: 'Barlow', 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
      }
      .font-sub {
        font-family: 'Barlow', 'Segoe UI', Arial, sans-serif;
        font-weight: 600;
      }
      .font-body {
        font-family: 'Barlow', 'Segoe UI', Arial, sans-serif;
        font-weight: 400;
      }
      .font-mono {
        font-family: 'Consolas', 'Segoe UI Mono', monospace;
        font-weight: 700;
      }
    </style>

    <!-- Card Gradients -->
    <linearGradient id="stub-red-clean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#A80720" />
    </linearGradient>

    <!-- Floating Shadow -->
    <filter id="ticket-shadow-clean" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Clip mask for perforated cutout notches -->
    <mask id="ticket-mask-clean">
      <rect width="800" height="420" rx="12" fill="#ffffff" />
      <circle cx="250" cy="0" r="14" fill="#000000" />
      <circle cx="250" cy="420" r="14" fill="#000000" />
    </mask>
  </defs>

  <!-- MASTER CONTAINER (MINIMALIST EXECUTIVE PASS) -->
  <g id="Layer_VIP_Pass" transform="translate(20, 20)">

    <!-- TICKET BASE WITH NOTCHES -->
    <g id="Ticket_Shape" filter="url(#ticket-shadow-clean)" mask="url(#ticket-mask-clean)">
      
      <!-- LEFT STUB (Width 250) -->
      <g id="Ticket_Left_Stub">
        <rect x="0" y="0" width="250" height="420" fill="url(#stub-red-clean)" />

        <!-- Stub Header -->
        <g transform="translate(24, 26)">
          <text x="0" y="20" fill="#ffffff" class="font-heavy" font-size="22" letter-spacing="1">
            T&amp;T <tspan fill="#FDE68A">VINA</tspan>
          </text>
          <text x="0" y="38" fill="#fecaca" class="font-heavy" font-size="14" letter-spacing="1.5">
            MURRPLASTIK GERMANY
          </text>
          <text x="0" y="52" fill="#fca5a5" class="font-body" font-size="10">
            ĐẠI LÝ ỦY QUYỀN CHÍNH THỨC
          </text>
        </g>

        <!-- Minimalist QR Code Box -->
        <g transform="translate(42, 104)">
          <rect width="166" height="166" rx="8" fill="#ffffff" />
          
          <!-- Vector QR Code Matrix -->
          <g transform="translate(15, 15)">
            <rect x="0" y="0" width="34" height="34" fill="#0f172a" />
            <rect x="6" y="6" width="22" height="22" fill="#ffffff" />
            <rect x="11" y="11" width="12" height="12" fill="#C8102E" />

            <rect x="102" y="0" width="34" height="34" fill="#0f172a" />
            <rect x="108" y="6" width="22" height="22" fill="#ffffff" />
            <rect x="113" y="11" width="12" height="12" fill="#C8102E" />

            <rect x="0" y="102" width="34" height="34" fill="#0f172a" />
            <rect x="6" y="108" width="22" height="22" fill="#ffffff" />
            <rect x="11" y="113" width="12" height="12" fill="#C8102E" />

            <rect x="44" y="6" width="12" height="12" fill="#0f172a" />
            <rect x="66" y="6" width="18" height="10" fill="#0f172a" />
            <rect x="44" y="24" width="24" height="12" fill="#0f172a" />
            <rect x="74" y="24" width="12" height="24" fill="#0f172a" />
            
            <rect x="12" y="44" width="18" height="12" fill="#0f172a" />
            <rect x="38" y="44" width="16" height="16" fill="#C8102E" />
            <rect x="64" y="44" width="24" height="12" fill="#0f172a" />
            <rect x="98" y="44" width="28" height="16" fill="#0f172a" />

            <rect x="6" y="66" width="24" height="14" fill="#0f172a" />
            <rect x="36" y="70" width="24" height="18" fill="#0f172a" />
            <rect x="70" y="66" width="16" height="16" fill="#0f172a" />
            <rect x="102" y="70" width="24" height="14" fill="#0f172a" />

            <rect x="44" y="98" width="16" height="28" fill="#0f172a" />
            <rect x="70" y="94" width="22" height="16" fill="#0f172a" />
            <rect x="102" y="94" width="16" height="16" fill="#0f172a" />
            <rect x="70" y="120" width="48" height="14" fill="#0f172a" />
