            <rect width="126" height="28" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" />
            <circle cx="14" cy="14" r="3.5" fill="#16a34a" />
            <text x="24" y="18" fill="#16a34a" class="font-sub" font-size="10.5" letter-spacing="0.5">STATUS: ISSUED</text>
