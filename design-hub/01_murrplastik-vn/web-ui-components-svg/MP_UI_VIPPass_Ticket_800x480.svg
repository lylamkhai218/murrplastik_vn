          <text x="0" y="0" fill="#64748b" class="font-sub" font-size="10.5" letter-spacing="0.5">QUYỀN LỢI ĐẶC CÁCH KÈM THEO:</text>
          
          <g transform="translate(0, 12)">
            <g transform="translate(0, 0)">
              <circle cx="5" cy="5" r="5" fill="#C8102E" />
              <path d="M 2.5 5 L 4.5 7 L 7.5 3" stroke="#ffffff" stroke-width="1.25" fill="none" />
              <text x="16" y="9" fill="#334155" class="font-sub" font-size="11.5">Tiếp đón VIP Lounge &amp; Cà phê Đức</text>
            </g>

            <g transform="translate(180, 0)">
              <circle cx="5" cy="5" r="5" fill="#C8102E" />
              <path d="M 2.5 5 L 4.5 7 L 7.5 3" stroke="#ffffff" stroke-width="1.25" fill="none" />
              <text x="16" y="9" fill="#334155" class="font-sub" font-size="11.5">Tư vấn 1:1 cùng Mr. Kevin Wong (Murrplastik APAC)</text>
            </g>
          </g>
        </g>

        <!-- BOTTOM BARCODE & VERIFICATION -->
        <g id="Bottom_Barcode" transform="translate(32, 308)">
          <line x1="0" y1="0" x2="486" y2="0" stroke="#f1f5f9" stroke-width="1.5" />
          
          <!-- Barcode Vector -->
          <g transform="translate(0, 14)" fill="#0f172a">
            <rect x="0" y="0" width="3" height="34" />
            <rect x="5" y="0" width="2" height="34" />
            <rect x="9" y="0" width="6" height="34" />
            <rect x="18" y="0" width="2" height="34" />
            <rect x="23" y="0" width="4" height="34" />
            <rect x="30" y="0" width="8" height="34" />
            <rect x="42" y="0" width="3" height="34" />
            <rect x="48" y="0" width="5" height="34" />
            <rect x="56" y="0" width="2" height="34" />
            <rect x="62" y="0" width="6" height="34" />
            <rect x="71" y="0" width="2" height="34" />
            <rect x="76" y="0" width="4" height="34" />
            <rect x="83" y="0" width="8" height="34" />
            <rect x="94" y="0" width="3" height="34" />
            <rect x="100" y="0" width="6" height="34" />
            <rect x="110" y="0" width="2" height="34" />
            <rect x="115" y="0" width="5" height="34" />
            <rect x="123" y="0" width="3" height="34" />
            <rect x="129" y="0" width="7" height="34" />
            <rect x="140" y="0" width="2" height="34" />
            <rect x="145" y="0" width="4" height="34" />
            <rect x="152" y="0" width="8" height="34" />
            <rect x="163" y="0" width="3" height="34" />
            <rect x="170" y="0" width="5" height="34" />
            <rect x="180" y="0" width="2" height="34" />
            <rect x="185" y="0" width="6" height="34" />
          </g>

          <text x="0" y="64" fill="#64748b" class="font-mono" font-size="10.5">CODE: VEC26-8868-83693086-VIP</text>

          <g transform="translate(230, 14)">
            <text x="0" y="14" fill="#0f172a" class="font-sub" font-size="11.5">
              ⚡ Xuất trình mã này cho Kỹ sư T&amp;T Vina tại Sảnh 2.
            </text>
            <text x="0" y="30" fill="#64748b" class="font-body" font-size="10.5">
              Quà tặng được trao trực tiếp &amp; kích hoạt tư vấn kỹ thuật.
            </text>
          </g>
        </g>

      </g>

    </g>

    <!-- DASHED PERFORATION LINE AT x=250 -->
    <g id="Perforation_Line">
      <line x1="250" y1="16" x2="250" y2="404" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5" />
    </g>

    <!-- ACTION BUTTONS BELOW TICKET -->
    <g id="Action_Buttons" transform="translate(0, 440)">
      <!-- Button 1 -->
      <g transform="translate(120, 0)">
        <rect width="260" height="46" rx="8" fill="#C8102E" />
        <path d="M 34 16 L 34 26 M 30 22 L 34 26 L 38 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <path d="M 27 29 L 41 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="54" y="28" fill="#ffffff" class="font-heavy" font-size="15" letter-spacing="1">
          LƯU THẺ VIP VỀ MÁY (PNG)
        </text>
      </g>

      <!-- Button 2 -->
